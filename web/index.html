<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08141a">
<title>FM Drops</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="row">
    <h1><span>FM Drops</span></h1>
    <button id="btnSettings" class="ghost" aria-label="Configurações">⚙</button>
  </div>
  <div class="row" id="tools" hidden>
    <input id="search" type="search" placeholder="Buscar carta ou número" autocomplete="off">
    <div class="tabs" role="tablist">
      <button id="tabCards" role="tab" aria-selected="true">Cartas</button>
      <button id="tabDuelists" role="tab" aria-selected="false">Duelistas</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" role="dialog" aria-modal="true">
    <button id="sheetClose" class="ghost close" aria-label="Fechar">✕</button>
    <div id="sheetContent"></div>
  </div>
</div>

<input id="file" type="file" multiple hidden>

<script src="version.js"></script>
<script src="fm.js"></script>
<script src="app.js"></script>
</body>
</html>
