name: Site

# Publica a pasta web/ no branch gh-pages (GitHub Pages: Settings → Pages → Deploy from a branch → gh-pages).
on:
  push:
    paths: ['web/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p /tmp/site
          cp -r web/. /tmp/site/
          echo "window.APP_BUILD = ${{ github.run_number }};" > /tmp/site/version.js
          touch /tmp/site/.nojekyll
      - name: Publicar no gh-pages
        run: |
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "site: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
