name: APK

on:
  push:
    paths: ['web/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Testar o leitor com imagem falsa
        run: |
          node tools/make-fixture.js /tmp/fixture.bin
          node tools/extract.js /tmp/fixture.bin /tmp/out.json
      - name: Gravar número do build
        run: echo "window.APP_BUILD = ${{ github.run_number }};" > web/version.js
      - name: Empacotar o app para a atualização interna
        run: |
          node -e "
          const fs = require('fs');
          const files = {};
          for (const f of fs.readdirSync('web')) files[f] = fs.readFileSync('web/' + f, 'utf8');
          fs.writeFileSync('web.json', JSON.stringify({ build: ${{ github.run_number }}, files }));
          "
          echo "SHELL=$(cat android/shell-version.txt)" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk fmdrops.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fmdrops-apk
          path: fmdrops.apk
      - name: Publicar na release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FM Drops (último build)
          prerelease: true
          body: "build ${{ github.run_number }} shell ${{ env.SHELL }}"
          files: |
            fmdrops.apk
            web.json
          target_commitish: ${{ github.sha }}
